<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI News Station · Redirecting</title>
  <meta name="robots" content="noindex">
  <script>
    window.location.replace("/ai-news-station/" + window.location.search + window.location.hash);
  </script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f5ef;
      --surface: #fff;
      --text: #171717;
      --muted: #6b685f;
      --line: rgba(23, 23, 23, 0.12);
      --accent: #0f766e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11120f;
        --surface: #1a1b17;
        --text: #f2f1eb;
        --muted: #aaa79b;
        --line: rgba(242, 241, 235, 0.14);
        --accent: #2dd4bf;
      }
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: min(520px, 100%);
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      letter-spacing: 0;
    }
    p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.6;
    }
    a {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      -webkit-tap-highlight-color: rgba(15, 118, 110, 0.16);
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <main>
    <h1>正在回到 AI News Station</h1>
    <p>这个子路径没有独立页面，正在回到站点首页。</p>
    <a href="/ai-news-station/">打开 AI News Station</a>
  </main>
</body>
</html>
