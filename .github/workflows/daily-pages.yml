name: 生成日报静态页

on:
  schedule:
    # UTC 04:30 / 10:30 / 15:30 → 北京时间 12:30 / 18:30 / 23:30，每天三次
    - cron: '30 4,10,15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-data-writers
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 测试核心与审核逻辑
        run: node --test tests/*.test.*

      - name: 生成日报页与 sitemap
        run: node scripts/build-daily.mjs

      - name: 抽取候选 → 审核通过后合并进正式时间线 → 重建大事记静态页（模型发布 / 资本动态）
        run: |
          node scripts/extract-model-candidates.mjs
          node scripts/extract-funding-candidates.mjs
          node scripts/merge-candidates.mjs
          node scripts/build-timeline.mjs
          node scripts/build-funding.mjs
          node scripts/build-tools.mjs

      - name: 提交
        run: |
          node scripts/validate.mjs
          git add index.html daily data/daily data/review data/daily-index.json data/daily-latest.json data/models.json data/model-candidates.json data/funding.json data/funding-candidates.json timeline funding tools sitemap.xml robots.txt
          bash scripts/commit-data.sh "更新 AI 日报静态页与审核候选"
