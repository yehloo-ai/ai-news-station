<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>今日分享长图 · 飞翔的AI资讯站</title>
  <meta name="description" content="飞翔的AI资讯站每日 AI 日报分享长图预览。">
  <meta name="robots" content="noindex">
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --paper: #ffffff;
      --ink: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --soft: #f8fafc;
      --accent: #d01922;
      --accent-soft: rgba(208, 25, 34, 0.08);
      --green: #16a34a;
      --shadow: 0 18px 48px rgba(17, 24, 39, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    .shell {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 24px;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 28px;
      align-items: start;
    }

    .poster {
      width: min(720px, 100%);
      margin: 0 auto;
      background: var(--paper);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .poster-inner { padding: 30px 32px 28px; }

    .brand {
      display: flex;
      align-items: center;
      margin-bottom: 18px;
    }

    .brand-name {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .headline {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: 34px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: 0;
    }

    .headline span { color: inherit; }

    .red-line {
      height: 3px;
      width: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent) 86%, transparent 86%);
      margin-bottom: 18px;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
    }

    .date-pill {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 0 9px;
      border: 1px solid #111;
      border-radius: 6px;
      background: #fff;
      color: #111;
      font-size: 11.5px;
      font-weight: 700;
    }

    .count-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 26px;
      padding: 0 9px;
      border-radius: 999px;
      background: var(--soft);
      color: var(--ink);
      font-size: 11.5px;
      font-weight: 700;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
    }

    .timeline {
      --rail-x: 7px;
      position: relative;
      display: grid;
      gap: 14px;
      padding-left: 28px;
    }

    .timeline::before {
      content: "";
      position: absolute;
      top: 10px;
      bottom: 10px;
      left: var(--rail-x);
      width: 1px;
      transform: translateX(-50%);
      background: var(--ink);
      opacity: 0.36;
    }

    .section {
      position: relative;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--paper);
      box-shadow: 0 4px 14px rgba(17, 24, 39, 0.05);
    }

    .section::before {
      content: "";
      position: absolute;
      top: 22px;
      left: calc(var(--rail-x) - 28px);
      width: 7px;
      height: 7px;
      transform: translateX(-50%);
      border: 2px solid var(--paper);
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 1px rgba(208, 25, 34, 0.2);
    }

    .section-head {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 11px;
    }

    .section-num {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--soft);
      color: var(--accent);
      font-size: 14px;
      font-weight: 900;
    }

    .section-title {
      padding: 5px 8px;
      border-radius: 5px;
      background: var(--soft);
      color: var(--accent);
      font-size: 15px;
      font-weight: 800;
    }

    .story-list {
      display: grid;
      gap: 9px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .story {
      display: grid;
      grid-template-columns: 8px 1fr;
      gap: 9px;
      align-items: start;
      color: var(--ink);
      font-size: 16px;
      line-height: 1.45;
      font-weight: 720;
    }

    .story::before {
      content: "";
      width: 7px;
      height: 7px;
      margin-top: 8px;
      border-radius: 50%;
      background: #64748b;
    }

    .story-source {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .footer {
      display: block;
      margin-top: 28px;
      padding: 20px;
      border-radius: 10px;
      background: var(--soft);
    }

    .footer-title {
      margin: 0 0 8px;
      font-size: 25px;
      font-weight: 900;
    }

    .footer-url {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      word-break: break-all;
    }

    .panel {
      position: sticky;
      top: 24px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--paper);
    }

    .panel h2 {
      margin: 0 0 10px;
      font-size: 22px;
      letter-spacing: 0;
    }

    .panel p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.65;
    }

    .actions {
      display: grid;
      gap: 10px;
    }

    .btn {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      font-weight: 800;
      cursor: pointer;
    }

    .btn.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .hint {
      margin-top: 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    @media (max-width: 820px) {
      .shell {
        padding: 14px;
        grid-template-columns: 1fr;
      }
      .panel {
        position: static;
      }
      .poster-inner {
        padding: 24px 18px 22px;
      }
      .brand-name { font-size: 18px; }
      .headline { font-size: 28px; }
      .section-title { font-size: 14px; }
      .story { font-size: 15px; }
    }
    button:disabled { opacity:.5; cursor:wait; }
    :focus-visible { outline:2px solid #d01922; outline-offset:3px; }
    .section-title { margin:0; }
    .story a { overflow-wrap:anywhere; }
    .red-line { background:#d01922; height:2px; }
  </style>
</head>
<body>
  <div class="shell">
    <main class="poster" id="poster">
      <div class="poster-inner">
        <div class="brand">
          <div class="brand-name">飞翔的AI资讯站</div>
        </div>
        <h1 class="headline">AI <span>日报速览</span></h1>
        <div class="red-line"></div>
        <div class="meta-row">
          <div class="date-pill" id="datePill">加载中</div>
          <div class="count-pill"><span class="dot"></span><span id="countText">今日重点</span></div>
        </div>
        <div class="timeline" id="timeline" aria-live="polite"></div>
        <footer class="footer">
          <div>
            <p class="footer-title">2 分钟读懂今天的 AI</p>
            <p class="footer-url">yehloo-ai.github.io/ai-news-station</p>
          </div>
        </footer>
      </div>
    </main>

    <aside class="panel">
      <h2>日报分享</h2>
      <p id="editionInfo">正在读取日报存档</p>
      <div class="actions">
        <button class="btn primary" type="button" id="downloadBtn" disabled>下载长图 PNG</button>
        <button class="btn" type="button" id="shareBtn" disabled>系统分享</button>
        <a class="btn" href="../" id="editionLink">阅读完整日报</a>
        <button class="btn" type="button" id="copyBtn" disabled>复制分享文案</button>
      </div>
      <div class="hint" id="hint" role="status"></div>
    </aside>
  </div>

  <script src="../assets/station-core.js"></script>
  <script src="share.js"></script>
</body>
</html>
